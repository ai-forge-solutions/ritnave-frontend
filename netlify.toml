# Netlify builds and deploys this Next.js app through its Git integration
# (production branch: develop; pull requests get deploy previews). The OpenNext
# adapter is applied automatically: no plugin pin, no publish directory needed.
# Runtime configuration (FIREBASE_*, SESSION_SECRET, APP_ORIGIN, RITNAVE_API_URL)
# lives in Netlify environment variables, never in this file.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
