steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, '${_IMAGE}', .]
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --name web-health -d '${_IMAGE}'
        trap 'docker logs web-health; docker rm -f web-health >/dev/null' EXIT
        for attempt in {1..20}; do
          if [[ $$(docker inspect web-health --format '{{.State.Running}}') != true ]]; then exit 1; fi
          if docker exec web-health node -e 'fetch("http://127.0.0.1:8080/api/health").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))'; then exit 0; fi
          sleep 0.5
        done
        exit 1
images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1200s
