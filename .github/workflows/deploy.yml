name: deploy
# Continuous deployment of the public frontend after merge to develop (never from a PR).
# Keyless: GitHub OIDC -> Workload Identity Federation -> ritnave-deployer (set up once with
# infra/github-oidc-setup.sh in the backend repo). `deploy.sh --release` only builds and rolls
# out; identity/secret/invoker IAM stays with an administrator's `--apply`.
on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-frontend
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_ORIGIN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and roll out
        env:
          FIREBASE_AUTH_PROJECT_ID: nutria-9c71e
          FIREBASE_AUTH_TENANT_ID: ${{ vars.FIREBASE_AUTH_TENANT_ID }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
        run: bash scripts/deploy.sh --release
      - name: Smoke (public health and readiness)
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
        run: |
          for path in /api/health /api/ready; do
            curl --fail --silent --show-error --max-time 20 --retry 5 --retry-all-errors "$APP_ORIGIN$path" >/dev/null
            echo "OK $path"
          done
